id: ai-inbox
name: AI Inbox
prose: >-
  The AI Inbox is the "For you" sort of the article list: the model ranks unread articles for the
  reader, learns from what the reader does, and puts the most relevant and important articles
  first. It is no longer a separate place; Today and For you rank with the same learned taste.
behaviors:
  - id: inbox-is-reachable
    description: >-
      The AI Inbox is the "For you" sort of the article list, not a destination of its own, and the
      list offers it as a subtle Smart sorting switch: on ranks the list For you, off shows the raw
      articles newest first. The switch is remembered across launches. Unread and All lists of every
      feed, one feed or a folder can be smart sorted; a smart sorted list shows only unread
      articles.
    details: >-
      Desktop puts a small "Smart sort" switch beside the list title (replacing the old Sort row)
      and keeps a "For you" command in the palette. iOS has an on/off sparkles capsule in the list's top bar
      (filled with the accent when on, outlined when off) instead of a row in the actions menu, plus a For you row in the feed picker
      and an optional For you bottom bar item. Choosing For you from Starred or Recent switches to
      Unread first, since those lists are not ranked. Desktop no longer has an AI Inbox row in the
      sidebar.
    source:
      text: >-
        we should have a way of toggling "smart sorting" in the all articles view, thus
        re-introducing the ai-inbox but subtly, in case I just wanna read raw articles directly
      reference: >-
        Giulio, project chat, 2026-10-22 (earlier: "Do both" on the decision card "Unify Skim's
        taste ranking across Today and the AI Inbox?", 2026-10-14)
  - id: sort-keeps-the-look
    description: >-
      Smart sorting only reorders the list. Rows look exactly as in the plain list (feed icon,
      source, date, thumbnail), with no rank numbers, rating meters, reasons, "Not rated yet"
      lines, tier headers or extra header and disclaimer.
    details: >-
      Date headers are dropped while smart sorted, since the order is no longer by date. iOS shows
      one status line, aligned with the row titles, only while rating runs or after it failed;
      pull to refresh rates new articles. Desktop keeps the theme chips above the list. Replaces
      the earlier desktop tiers (Top picks, Worth reading, When you have time, Low priority) with
      Importance and For you meters, and iOS's numbered rows.
    source:
      text: Sorting should just sort not change the looks
      reference: Giulio, project thread "Customize smart sort with layered prompts", 2026-10-27
  - id: ios-list-toolbar-actions
    description: >-
      On iOS the Unread and All lists put Chat with Articles and the Smart sorting switch directly
      in the top bar, not behind the actions menu.
    details: >-
      The top bar reads Feeds, the list title, Chat, the Smart sorting capsule and the actions
      menu; the title sits between the buttons so they fit on an iPhone SE. The menu keeps Discover
      Feeds, Customize Bottom Bar and Settings, plus a For you row on lists that cannot be smart
      sorted. Today keeps its own chat entries in its menu.
    source:
      text: >-
        Some of these actions in ios app (like chat and smart sort toggle) would be nice to have
        right there instead of hidden behind menu
      reference: Giulio, project thread "Surface chat and smart sort on iOS", 2026-10-26
  - id: ranks-by-relevance-and-importance
    description: >-
      The model assesses each unread article's relevance to the reader and its importance, and the
      AI Inbox sorts articles with the most relevant and important first.
    details: >-
      The model rates every unread article on two 1-5 scales, importance (the impact of the thing
      at the center of the article, judged the same in every field, with no kind of news given a
      head start; see today.yaml ranked-by-consequence) and relevance (fit with this reader), plus a
      one-line reason. Both apps
      rank by the shared skim_inbox_score in SkimStoryPolicy, which blends the two ratings with
      learned taste and a small recency decay; pinned articles stay on top. The ranked list
      looks like the plain list (see sort-keeps-the-look). iOS stores each article's rating so it
      is rated once, and re-ranks on every visit. The legacy priority is
      derived from the two ratings. Contract: shared/fixtures/inbox-ranking.json.
    source:
      text: >-
        It should learn on my preferences as well as assess relevance and importance of an article
        and sort articles by most relevant and important first
      reference: Giulio, project thread "AI inbox ranking", 2026-10-10
  - id: learns-preferences
    description: >-
      Ranking learns on the device from the reader's behavior: articles opened and how long they
      were read, chats, stars (saves), Pin to top, and inbox articles dismissed without being opened.
      Both platforms count each chat message about an article as a minute of reading.
    details: >-
      Each signal is weighted by the shared policy and tallied per feed and per title word into an
      affinity of -1 to 1. The affinity carries up to half of the relevance axis once there are
      about 40 signals. iOS dismisses by swiping an inbox row; desktop counts triaged articles
      marked read without being opened. Desktop no longer shows the more/less-like-this buttons;
      earlier feedback still counts.
  - id: explicit-interests
    description: >-
      The reader can write their own smart sort prompt (for example "prioritize AI infra,
      deprioritize sports"), and ranking uses it ahead of the learned preferences.
    details: >-
      It is layer 2 of smart-sort-prompt-layers and lives in the Smart sort settings (desktop
      Settings > Smart sort; iOS Smart sort settings), no longer in Settings > AI.
  - id: smart-sort-prompt-layers
    description: >-
      Smart sort ranks with three prompts, in this order: a built-in base prompt, an optional prompt
      the reader writes, and a "learned preferences" note generated from the reader's reading. A
      Smart sort settings surface on desktop and iOS, reachable from the Smart sort switch, shows all
      three; the base prompt is shown read-only.
    details: >-
      The base prompt is skim_inbox_triage_prompt in SkimStoryPolicy, shared by both apps. The
      reader's prompt is AiSettings.triage_user_prompt. Desktop: a cog at the end of the Smart sort switch's pill
      opens Settings on its Smart sort tab, which also names the AI model ranking uses and links to
      AI Provider; edits there save with Settings' Save. iOS: a Smart sort settings row in the list's actions menu, a long press on the sparkles
      capsule, and Settings > AI > Preferences > Smart sort all open the same screen, which saves as
      you go. The raw learned titles the triage prompt used to carry are replaced by the note.
    source:
      text: >-
        there should be some sort of base prompt for smart sort and then an additional prompt that
        users can provide and also a learnt "user preferences" prompt that can still be deleted /
        modified
      reference: Giulio, project thread "Customize smart sort with layered prompts", 2026-10-27
  - id: learned-preferences-note
    description: >-
      The learned preferences are a short plain-text note of what the reader likes and skips. The
      reader can read, edit or delete it, and smart sort keeps learning afterward: it rewrites the
      note from new reading while keeping the reader's edits.
    details: >-
      The note is at most 8 lines and 800 characters, rewritten by the reader's AI model with the
      shared skim_inbox_learn_prompt from the current note plus only the signals recorded since it
      was last written or edited (desktop: reading time, chats, more/less feedback and pins; iOS:
      reading time, chats, pins and dismissals). skim_inbox_learn_due decides when: 20 new signals
      for a first note, 15 for a rewrite, and at least 6 hours apart. It runs before a triage run
      and from a Learn now button. Deleting clears the note and learning restarts from reading after
      the delete, never from older history. Turning off "Keep learning from my reading" freezes the
      note. A rewrite that finishes after the reader edited the note is dropped. Each device keeps
      its own note (desktop in its settings table, iOS in UserDefaults). Learned taste in the
      ranking score itself (learns-preferences) is separate and unaffected.
    source:
      text: >-
        a learnt "user preferences" prompt that can still be deleted / modified
      reference: Giulio, project thread "Customize smart sort with layered prompts", 2026-10-27
  - id: triage-on-open
    description: >-
      Opening the AI Inbox runs triage on new unread articles with visible progress, and the reader
      can run it again.
  - id: theme-chips
    description: >-
      Desktop: themes clustered across unread articles appear as chips that filter a list sorted
      For you.
  - id: priority-feeds-other-features
    description: >-
      Triage priority also scopes Ask Skim's Inbox scope.
  - id: ratings-survive-a-bad-batch
    description: >-
      One bad model response costs at most the articles in it: ratings the model finished before
      it was cut off are kept, and the other batches are still rated.
    details: >-
      Articles are rated in batches (20 on iOS, 30 on desktop for hosted models) with an output
      budget of 80 tokens per article plus 300. A response cut off mid-array keeps every entry it
      finished. Desktop already moved on to the next batch after a failure; iOS now does too, and
      first retries a failed batch as two halves. The error shows only when nothing could be
      rated; otherwise iOS says how many were rated and leaves the rest for the next run.
      Reported with a screenshot of "The AI model didn't return usable ratings" over a list of
      "Not rated yet" articles (Giulio, 2026-10-15). Claude 5-series models also spent the
      budget on thinking; ai-providers/claude-thinking-models-answer (#263) covers that.
