id: ai-inbox
name: AI Inbox
prose: >-
  The AI Inbox is where the model ranks unread articles for the reader. It learns from what the
  reader does and puts the most relevant and important articles first.
behaviors:
  - id: inbox-is-reachable
    description: >-
      The AI Inbox is reachable on both platforms: desktop from the sidebar and command palette, iOS
      from the article list actions menu.
  - id: ranks-by-relevance-and-importance
    description: >-
      The model assesses each unread article's relevance to the reader and its importance, and the
      AI Inbox sorts articles with the most relevant and important first.
    details: >-
      Today the model assigns priority 1-5 with a one-line reason (Must Read, Important, Worth
      Reading, Routine, Skip), and desktop groups the inbox by those labels. Making relevance and
      importance explicit in the sort is in progress (2026-10-10) in the "AI inbox ranking" thread.
    source:
      text: >-
        It should learn on my preferences as well as assess relevance and importance of an article
        and sort articles by most relevant and important first
      reference: Giulio, project thread "AI inbox ranking", 2026-10-10
  - id: learns-preferences
    description: >-
      Ranking learns from the reader's behavior: reading time, stars, chats, summaries requested, and
      priority overrides such as Pin to top.
    details: >-
      Desktop no longer shows the more/less-like-this buttons; earlier feedback still counts.
  - id: explicit-interests
    description: >-
      The reader can describe their interests in Settings > AI, and ranking uses that text alongside
      the learned preferences.
  - id: triage-on-open
    description: >-
      Opening the AI Inbox runs triage on new unread articles with visible progress, and the reader
      can run it again.
  - id: theme-chips
    description: >-
      Desktop: themes clustered across unread articles appear as chips that filter the AI Inbox.
  - id: priority-feeds-other-features
    description: >-
      Triage priority also scopes Quick Catch-up's Priority inbox and Ask Skim's Inbox scope.
