id: ai-inbox
name: AI Inbox
prose: >-
  The AI Inbox is the "For you" sort of the article list: the model ranks unread articles for the
  reader, learns from what the reader does, and puts the most relevant and important articles
  first. It is no longer a separate place; Today and For you rank with the same learned taste.
behaviors:
  - id: inbox-is-reachable
    description: >-
      The AI Inbox is the "For you" sort of the article list, not a destination of its own. Unread
      and All lists of every feed, one feed or a folder can be sorted Newest or For you; a list
      sorted For you shows only unread articles. Desktop has a Sort control under the list's search
      box and a "For you" command in the palette; iOS has Sort in the list's actions menu, a For you
      row in the feed picker and an optional For you bottom bar item.
    details: >-
      Choosing For you from Starred or Recent switches to Unread first, since those lists are not
      ranked. Desktop no longer has an AI Inbox row in the sidebar.
    source:
      text: Do both
      reference: >-
        Giulio, project chat, 2026-10-14, choosing "Do both" on the decision card "Unify Skim's
        taste ranking across Today and the AI Inbox?" (Today uses the inbox taste model, and the
        AI Inbox becomes a For you sort of the article list)
  - id: ranks-by-relevance-and-importance
    description: >-
      The model assesses each unread article's relevance to the reader and its importance, and the
      AI Inbox sorts articles with the most relevant and important first.
    details: >-
      The model rates every unread article on two 1-5 scales, importance (significance for anyone
      following the area) and relevance (fit with this reader), plus a one-line reason. Both apps
      rank by the shared skim_inbox_score in SkimStoryPolicy, which blends the two ratings with
      learned taste and a small recency decay; pinned articles stay on top. Desktop groups the
      ranked list into Top picks, Worth reading, When you have time and Low priority, and each
      card shows Importance and For you meters. iOS opens the AI Inbox full screen, stores each
      article's rating so it is rated once, and re-ranks on every visit. The legacy priority is
      derived from the two ratings. Contract: shared/fixtures/inbox-ranking.json.
    source:
      text: >-
        It should learn on my preferences as well as assess relevance and importance of an article
        and sort articles by most relevant and important first
      reference: Giulio, project thread "AI inbox ranking", 2026-10-10
  - id: learns-preferences
    description: >-
      Ranking learns on the device from the reader's behavior: articles opened and how long they
      were read, chats, stars (saves), Pin to top, and inbox articles dismissed without being opened.
      Both platforms count each chat message about an article as a minute of reading.
    details: >-
      Each signal is weighted by the shared policy and tallied per feed and per title word into an
      affinity of -1 to 1. The affinity carries up to half of the relevance axis once there are
      about 40 signals. iOS dismisses by swiping an inbox row; desktop counts triaged articles
      marked read without being opened. Desktop no longer shows the more/less-like-this buttons;
      earlier feedback still counts.
  - id: explicit-interests
    description: >-
      The reader can describe their interests in Settings > AI, and ranking uses that text alongside
      the learned preferences.
  - id: triage-on-open
    description: >-
      Opening the AI Inbox runs triage on new unread articles with visible progress, and the reader
      can run it again.
  - id: theme-chips
    description: >-
      Desktop: themes clustered across unread articles appear as chips that filter a list sorted
      For you.
  - id: priority-feeds-other-features
    description: >-
      Triage priority also scopes Ask Skim's Inbox scope.
  - id: ratings-survive-a-bad-batch
    description: >-
      One bad model response costs at most the articles in it: ratings the model finished before
      it was cut off are kept, and the other batches are still rated.
    details: >-
      Articles are rated in batches (20 on iOS, 30 on desktop for hosted models) with an output
      budget of 80 tokens per article plus 300. A response cut off mid-array keeps every entry it
      finished. Desktop already moved on to the next batch after a failure; iOS now does too, and
      first retries a failed batch as two halves. The error shows only when nothing could be
      rated; otherwise iOS says how many were rated and leaves the rest for the next run.
      Reported with a screenshot of "The AI model didn't return usable ratings" over a list of
      "Not rated yet" articles (Giulio, 2026-10-15). Claude 5-series models also spent the
      budget on thinking; ai-providers/claude-thinking-models-answer (#263) covers that.
