id: ai-providers
name: AI providers and models
prose: >-
  Skim is an interface to models the reader chooses. Every AI feature runs on the configured
  provider, cloud or on-device.
behaviors:
  - id: desktop-providers
    description: >-
      Desktop providers: None, Local (llama.cpp), On-device MLX, Apple Intelligence, Ollama, Claude
      Pro/Max (OAuth), ChatGPT Plus/Pro, Claude CLI (legacy), Claude API key, OpenAI, Grok (xAI), DeepSeek DS4 (Mac
      only), OpenRouter, and Custom (any OpenAI-compatible endpoint).
  - id: app-store-providers
    description: >-
      A Mac App Store or TestFlight copy offers no API key entry: it keeps on-device engines,
      Ollama, and sign-in to Claude, ChatGPT and SuperGrok plans. Local and direct-download builds
      keep every provider.
    details: >-
      App Review rejected macOS 0.1.4 under guideline 3.1.1: API keys may unlock features only if
      they can be bought through In-App Purchase, in Skim or in the provider's own App Store app.
      Those three plans are sold through IAP in their providers' apps; raw API keys are not. A copy
      counts as App Store when Contents/_MASReceipt/receipt exists. A saved provider that the copy
      hides shows as unavailable. Proposal pending Giulio's choice between this and on-device only
      (APP_STORE_AI_POLICY in src/lib/aiModels.ts).
  - id: ios-providers
    description: >-
      iOS providers: Apple Intelligence (default), On-device MLX, Claude Pro/Max, ChatGPT Plus/Pro, Grok
      (xAI), Claude API key, OpenAI, OpenRouter, and Custom.
  - id: offline-falls-back-on-device
    description: >-
      With no internet connection, requests meant for a cloud provider run on the on-device model
      instead, and the model picker says so with a subtle offline marker. The chosen provider
      answers again once the connection is back; settings never change.
    details: >-
      Order: Apple Intelligence where it is available, then a downloaded MLX model, then (desktop)
      a downloaded llama.cpp model; with none ready the cloud request fails as before. iOS goes by
      the system's network status and also retries on device when a cloud request fails for want
      of a connection. Desktop checks that the provider's host (or the system proxy) answers,
      rechecking every few seconds while it does not. Custom endpoints on this machine or the
      local network count as local. iOS shows "Apple Intelligence · offline" with a no-Wi-Fi icon
      on the picker chip; desktop shows a no-Wi-Fi icon beside compact pickers and "Offline · using
      Apple Intelligence" under the Summarize picker.
    source:
      text: I want ai provider to fallback to local if no internet connection
      reference: Giulio, project thread "Read and use AI offline", 2026-10-26
  - id: keys-kept-per-provider
    description: >-
      Each provider keeps its own API key, endpoint, and model, so switching away and back does not
      lose them.
  - id: inline-model-picker
    description: >-
      Ask Skim, article chat, Summarize, and Today (in its cog) each have a model picker that
      changes the model for the current provider and links to AI settings.
    details: >-
      Remote model lists are fetched live; a failed fetch falls back to the current model. Claude
      Pro/Max lists Anthropic's /v1/models with its sign-in token on desktop and iOS.
    source:
      text: "also why am i not getting dropdown with model names ?"
      reference: Giulio, project chat, 2026-10-15 (desktop Claude Pro/Max showed a plain text box)
  - id: model-lists-load-on-their-own
    description: >-
      Every model picker loads its provider's model list on its own, with no refresh button to
      press: AI settings when it opens and whenever the provider, key, or endpoint changes, and the
      inline pickers each time they open after an empty or failed load.
    details: >-
      Settings and the inline pickers share one cached list per provider, endpoint and key, so a
      list one loads shows up in the others. In desktop AI settings the list shows as a menu under
      the Model field with the friendly name first and the id beneath, the current model checked,
      and whole rows that scroll; typing filters it and any model id can still be entered. iOS
      settings reload the list when the provider, key, endpoint, or sign-in changes.
    source:
      text: "models should always autorefresh without having to hit refresh - also the dropdown should look better"
      reference: Giulio, project thread "Auto-refresh model list and polish picker", 2026-10-25 (also "this dropdown from chat config wasn't showing models till i opened the ai settings and hit refresh")
  - id: model-list-provider-order
    description: >-
      Model pickers list a provider's models in the order its API returns them, and leave out
      models that cannot answer chat, such as image and video models.
    details: >-
      Desktop, iOS and BYOS all keep the `/models` order, dropping only repeats and ids naming
      image, video, audio, embedding or moderation models (for example xAI's grok-imagine-*).
    source:
      text: "model order is not right - we should follow order from api response - this should have been fixed in BYOS - check"
      reference: Giulio, project thread "Model picker order", 2026-10-15
  - id: claude-models-accept-request
    description: >-
      Any Claude model the picker lists runs Skim's requests; Skim sends sampling settings such as
      temperature only to models that accept them.
    details: >-
      Claude 4.7 and later, and every 5-series model, reject a temperature with a 400, so iOS and
      desktop omit it for those and for any model they do not recognise. Found when Catch-up on
      claude-sonnet-5-5 failed with "Claude request failed (400). Try again."
    source:
      text: 'Screenshot: Quick Catch-up, Anything unread, claude-sonnet-5-5, "Claude request failed (400). Try again."'
      reference: Giulio, project thread "Claude 400 in Catch-up", 2026-10-12
  - id: provider-errors-say-why
    description: >-
      When a provider rejects a request, the error shown says the provider's reason (for example an
      unsupported parameter or a prompt that is too long) rather than only a status code.
    details: >-
      The reason is the provider's error message, never the raw JSON body. Sign-in, plan, rate-limit,
      and outage errors keep their own friendly wording.
  - id: claude-subscription-runs-every-model
    description: >-
      Signed in with a Claude Pro/Max subscription, every Claude model the picker lists answers
      Skim's requests on iOS and desktop.
    details: >-
      A subscription (OAuth) request whose system prompt does not open with the Claude Code identity
      line gets a 429 "Error" from Sonnet and Opus. Desktop always sent that line; iOS did not, so Ask
      about this story on claude-sonnet-5-5 showed "Claude is rate-limited right now" to a reader
      with no limits hit.
    source:
      text: "Smthing is broken with byos and claude - I don't have rate limits"
      reference: Giulio, project thread "Claude rate-limit error with BYOS", 2026-10-13
  - id: claude-thinking-models-answer
    description: >-
      Claude models that think before answering (every 5-series model) still return an answer to
      chat, Ask Skim, and summaries rather than an empty response; when Claude does return no text,
      the error says why (out of room, or declined) where the response tells it.
    details: >-
      5-series models think by default and the thinking counts against the output limit, so a
      long article context could use Ask Skim's whole budget and come back as "The Claude response
      was empty." iOS and desktop ask these models for low effort with at least 4,096 output tokens,
      and a tool-use turn is replayed with its thinking blocks.
    source:
      text: 'Screenshot: Ask Skim on claude-sonnet-5-5, "The Claude response was empty." twice. "Empty responses"'
      reference: Giulio, project thread "Empty responses", 2026-10-14
  - id: rate-limit-error-only-for-real-limits
    description: >-
      Skim says a provider is rate-limited only when the provider says so: a retry-after time or a
      message naming the limit. A bare 429 says the request was turned down instead.
    details: With a retry-after header the message says how many minutes to wait.
  - id: desktop-local-models
    description: >-
      Desktop local models come from a curated list (Qwen3.5 2B, 4B recommended, 9B, 35B-A3B on Macs
      with 32 GB or more, and Gemma 4 E4B), can be downloaded, deleted, or browsed on Hugging Face,
      and honor a power mode (Cool, Balanced, Performance), optional preload, and idle eviction.
    details: The local model's context is sized to the prompt rather than fixed.
  - id: ios-mlx-models
    description: >-
      iOS on-device MLX defaults to Qwen3 1.7B, offers a curated catalog filtered to what the device
      can run (iPhones see models under 4 GB), and supports download with progress, cancel, and
      delete.
    details: >-
      Qwen3 1.7B became the default after scoring 8/8 versus Gemma 3 1B's 5/8 on the chat answer
      quality eval. Existing Gemma users keep Gemma unless Qwen is already downloaded. A saved model
      that leaves the catalog stays selectable as legacy.
  - id: on-device-memory-safety
    description: >-
      iOS evicts the loaded model when the app backgrounds or the device runs hot, and caps prompt
      size by device memory so on-device AI does not crash the app.
  - id: on-device-on-apple-silicon-macs
    description: >-
      Desktop reports on-device MLX and Apple Intelligence as available on every Apple silicon Mac
      that supports them (Apple Intelligence needs macOS 26).
  - id: ds4-large-macs
    description: >-
      Desktop offers DeepSeek V4 Flash (DS4) only on Macs with at least 96 GiB of memory, as a
      resumable, checksum-verified download.
