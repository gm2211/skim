id: article-list
name: Article list
behaviors:
  - id: sidebar-views
    description: >-
      Desktop: the sidebar lists Today, All Articles (with unread count), Starred and Recent,
      followed by feeds and folders, with Settings at the bottom. The AI Inbox is the list's For
      you sort (ai-inbox.inbox-is-reachable), not a sidebar row.
  - id: list-filters
    description: >-
      The list filters to Unread (default), Starred, or All. The Starred view shows starred articles
      whether or not they are read.
  - id: open-article-stays-listed
    description: >-
      In an unread-only list, the article open in the reader stays listed (styled as read) while it
      is open. After the reader moves to another article, it lingers briefly (2 minutes on desktop,
      30 on iOS) and then drops out.
    source:
      text: >-
        read article reaper in the sidebar should not reap open article / it should then be reaped
        after some time that i move to another article
      reference: Giulio, project thread "Keep open article in sidebar", 2026-10-25
  - id: recent-view
    description: >-
      Desktop: Recent lists articles the reader engaged with, ordered by engagement or by recency,
      and an item can be removed from Recent.
  - id: bulk-read-actions
    description: >-
      A reader can mark all articles in the current scope read, and mark everything above or below
      an article as read or unread.
  - id: library-search
    description: >-
      Searching matches article titles, sources, and URLs across the whole library, including read
      articles.
  - id: list-context-menu
    description: >-
      An article's context menu offers mark read/unread, star/unstar, and mark above/below. iOS also
      offers Summarize and Open Link from the list.
  - id: optional-excerpts
    description: Desktop can show an excerpt under each article title (Appearance setting).
  - id: aggregator-row-source
    description: >-
      On iOS a Hacker News, Lobsters or Reddit row names the site the story links to (ipinfo.io)
      under its title, never the feed's "Comments" stub.
