id: catch-up
name: Quick Catch-up
prose: >-
  Quick Catch-up turns unread articles from a chosen time range into a newspaper front page, written
  by the reader's model and citing every source.
behaviors:
  - id: newspaper-front-page
    description: >-
      Quick Catch-up lays its stories out like a newspaper front page: a full-width lead story,
      secondary stories, and briefs.
  - id: stories-print-as-they-land
    description: >-
      Stories appear as the model produces them, with placeholders for ledes still being written.
      The front page keeps its shape throughout: the slots the run will fill (the expected story
      count, or seven before it is known) are drawn as ghost shapes in their tiers from the first
      story on, and the masthead controls stay on one row, dropping their labels when narrow. A
      lead with no picture lists its coverage by title where the picture would go.
    source:
      text: looks great at first but then loses shape
      reference: Giulio, project chat, 2026-10-11
  - id: cited-sources
    description: >-
      Each story groups its coverage and cites every source it used; tapping a source opens that
      article.
  - id: scope-and-range
    description: >-
      The reader picks what to include (desktop: All unread by default, or Priority inbox for
      priority 4-5 only) and how far back to go (6 hours, 24 hours, 3 days, a week, or anything
      unread). Desktop remembers the last choice.
  - id: stop-and-rerun
    description: >-
      A run can be stopped at any time, which cancels the model request. Changing scope or range
      mid-run stops it too. After a stop the reader can run again to finish the page.
  - id: fits-on-device-memory
    description: >-
      On-device models never run the phone out of memory: Catch-up trims its input to the model's
      budget, and a request over the budget fails with advice to narrow the range or use a cloud
      provider.
  - id: page-not-modal
    description: >-
      Quick Catch-up is a page in the main window, not a modal: on desktop it takes the list
      column like Today, filling the window until a story's article is opened beside it, and the
      sidebar lists it under Today. On iOS it is pushed onto the article list like Today. Leaving
      and coming back keeps the written page for half an hour.
    source:
      text: ideally newspaper view is not a modal
      reference: Giulio, project chat, 2026-10-11
  - id: really-nice-newspaper-view
    description: >-
      The front page is set like a printed broadsheet on desktop and iOS: a serif nameplate on one
      masthead row with the controls, a dateline under a double rule, the lead story with its
      picture, two featured stories in equal columns, the remaining stories in a two-column tier
      divided by hairlines, and an "Also" block for briefs. While the page is being written a live
      rule sweeps under the dateline; before a run, and after a stop, a ghost page carries the
      invitation to run.
    details: >-
      Shipped 2026-10-10 (PR #208). Today uses the same type and dateline. Toolbar and palette
      buttons draw from one line-icon set and carry labels; Ask Skim offers example prompts.
    source:
      text: >-
        spin up fable 5.1 and do "self play" - I want a really nice newspaper view in both desktop
        and ios - also polish up ui buttons / icons and flows
      reference: Giulio, project thread "Newspaper view and UI polish", 2026-10-10
