id: catch-up
name: Catch me up
prose: >-
  "Catch me up" is an action on the Today page (formerly the separate Quick Catch-up page). It turns
  articles from a chosen time range into a newspaper front page, written by the reader's model and
  citing every source, in the edition's place under Today's masthead.
behaviors:
  - id: lives-on-today
    description: >-
      Catch-up is not a page of its own. On desktop a bolt button on Today's top bar switches the
      page between the day's edition and "Catch me up", which shows the run's controls and front
      page under the Today masthead; the sidebar row, list-toolbar button and separate page are
      gone, and the command palette's "Catch me up" opens Today with the catch-up showing. Picking
      Today from the sidebar returns to the edition. On iOS the bolt sits on Today's title bar and
      pushes the catch-up page, titled "Catch me up", whose back button returns to Today; the "…"
      menu, the bottom-bar option and the feed picker no longer offer it.
    details: >-
      Both pages grouped articles and used the model, so they read as duplicates. Today keeps the
      frozen daily edition, verified previews and read progress; "Catch me up" is the ad-hoc,
      model-written briefing over a window the reader picks.
    source:
      text: duplicate? [...] Chose "Merge them" on the decision card asking "Merge Quick Catch-up into Today as one page?"
      reference: Giulio, project chat and project thread "Newspaper view", 2026-10-12
  - id: newspaper-front-page
    description: >-
      "Catch me up" lays its stories out like a newspaper front page: a full-width lead story,
      secondary stories, and briefs.
  - id: stories-print-as-they-land
    description: >-
      Stories appear as the model produces them, with placeholders for ledes still being written.
      The front page keeps its shape throughout: the slots the run will fill (the expected story
      count, or seven before it is known) are drawn as ghost shapes in their tiers from the first
      story on, and the masthead controls stay on one row, dropping their labels when narrow. A
      lead with no picture lists its coverage by title where the picture would go.
    source:
      text: looks great at first but then loses shape
      reference: Giulio, project chat, 2026-10-11
  - id: same-paper-as-today
    description: >-
      The catch-up front page follows the Today design: nothing sits between the masthead and the
      page. What to include, how far back and the model live in Today's cog popover, and the run
      is the refresh icon on Today's top bar (spinning while the page is written, a stop while it
      spins); only the blank page's invitation carries a Run button. Every slot
      without a picture gets a text treatment (a feature sets its lede as a pull quote under an
      accent rule, a story gets a rule, the lead lists its coverage), so a day with no pictures
      still reads as a full page.
    source:
      text: >-
        did you ship this implementation and philosophy? there's a thread that's refining the
        newspaper view and I'm not sure it got the memo
      reference: Giulio, project thread "Today page design options", 2026-10-12
  - id: written-ledes
    description: >-
      Under a "Catch me up" headline the model writes the lede itself: one or two sentences, at
      most 60 words, from the full text of the articles behind the story, adding nothing that is
      not in them. A write that fails or says nothing falls back to the source-verified passage
      Today prints, then to the first clean sentence. Today itself keeps verbatim passages.
    details: >-
      Proposal pending Giulio's choice on the thread card (written ledes, recommended, or keep
      passages). Before this, Catch-up printed a verbatim passage cut at 60 words, which read as a
      quote trailing off rather than a briefing ("49 articles were read and I see this").
    source:
      text: help me understand - 49 articles were read and I see this - what's up?
      reference: Giulio, project chat, 2026-10-12
  - id: controls-in-the-cog
    description: >-
      The Include and Going back pickers are settings, not page furniture: they sit in Today's cog
      with the catch-up model, and "Run again" is the refresh icon on the top bar.
    source:
      text: all of this bit should just be in the cog config, and "Run again" should be just the refresh icon
      reference: Giulio, project thread "Newspaper view", 2026-10-12
  - id: cited-sources
    description: >-
      Each story groups its coverage and cites every source it used; tapping a source opens that
      article.
  - id: scope-and-range
    description: >-
      The reader picks what to include (desktop: All unread by default, Priority inbox for
      priority 4-5 only, or All articles, read or not, since the time window already bounds the
      run and an article marked read by accident still belongs on the page) and how far back to go
      (6 hours, 24 hours, 3 days, a week, or anything unread). Desktop remembers the last choice.
      iOS reads the list it was opened from.
    source:
      text: >-
        since I can control time window I should be able to select all articles (including the
        ones I read or accidentally marked as read)
      reference: Giulio, project chat, 2026-10-11
  - id: stop-and-rerun
    description: >-
      A run can be stopped at any time, which cancels the model request. Changing scope or range
      mid-run stops it too. After a stop the reader can run again to finish the page.
  - id: fits-on-device-memory
    description: >-
      On-device models never run the phone out of memory: Catch-up trims its input to the model's
      budget, and a request over the budget fails with advice to narrow the range or use a cloud
      provider.
  - id: page-not-modal
    description: >-
      Catch-up is never a modal: on desktop it shows on the Today page in the list column, filling
      the window until a story's article is opened beside it. On iOS it is pushed from Today like a
      page. Leaving and coming back keeps the written page for half an hour.
    source:
      text: ideally newspaper view is not a modal
      reference: Giulio, project chat, 2026-10-11
  - id: really-nice-newspaper-view
    description: >-
      The front page is set like a printed broadsheet on desktop and iOS: under Today's serif
      nameplate, the controls on one row, a dateline under a double rule, the lead story with its
      picture, two featured stories in equal columns, the remaining stories in a two-column tier
      divided by hairlines, and an "Also" block for briefs. While the page is being written a live
      rule sweeps under the dateline; before a run, and after a stop, a ghost page carries the
      invitation to run.
    details: >-
      Shipped 2026-10-10 (PR #208). Today uses the same type and dateline. Toolbar and palette
      buttons draw from one line-icon set and carry labels; Ask Skim offers example prompts.
    source:
      text: >-
        spin up fable 5.1 and do "self play" - I want a really nice newspaper view in both desktop
        and ios - also polish up ui buttons / icons and flows
      reference: Giulio, project thread "Newspaper view and UI polish", 2026-10-10
