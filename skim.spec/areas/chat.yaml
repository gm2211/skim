id: chat
name: Ask Skim and article chat
behaviors:
  - id: complete-chat-answers
    description: >-
      Chat answers are not cut off by a token cap sized for visible text.
    details: >-
      Hosted providers get an output ceiling of at least 8192 tokens, because some count hidden
      reasoning against it; on-device models keep their tier budgets. Shared with summaries through
      skim_ai_request_max_tokens in shared/SkimStoryPolicy.
    source:
      text: Also, chat response was cut off - are we artificially truncating?
      reference: Giulio, project chat, 2026-10-14
  - id: ask-skim-grounded
    description: >-
      Ask Skim answers a question from the reader's library with numbered citations to the articles
      it used, and lists separately the articles it only searched.
    details: >-
      Desktop scopes are Inbox (priority 3 and up), Unread (default), and All. Enter sends and
      Shift+Enter adds a line.
  - id: answer-first-with-source-cards
    description: >-
      A library chat answer leads with a short prose answer, cites articles inline as small numbered
      chips, and shows each cited article as a clickable card under it carrying the same number.
    details: >-
      The model is asked for about 50 to 100 words of prose that answers the question, with [n]
      right after the claim it supports, and not to list the articles, because the cards do that.
      Chips are numbered 1, 2, 3 in the order the reader first meets them, whatever position the
      article had in the search results, so a chip and its card always match. The whole card opens
      the article, not just its number. Desktop (Cmd+K palette and full Ask Skim chat): cards sit
      two to a row under a Sources label, hovering a chip lights up its card and hovering a card
      lights up its chips, and in the palette the arrow keys and Enter move through and open the
      cards. iOS Chat with Articles: tapping a chip opens the article, and the cards scroll in a row
      under the answer.
    source:
      text: >-
        I like tiles the best but 1. saying most detailed coverage is [6] doesn't help me tie back
        to what tiles, also I could use like 50-100 words to answer the questions and then show
        tiles, so I don't have to read everything to figure out what's going on. what I was
        thinking more was something along the lines of how perplexity responds to questions
      reference: Giulio, project thread "Chat answer citation design", 2026-10-23 (mock approved 2026-10-24); earlier "I want to be able to click the whole thing too not just the number"
  - id: web-sources-cited-inline
    description: >-
      When a chat answer uses web search, it cites each web result inline as a numbered chip that
      opens the page, and shows the cited results as cards with their site, title and a snippet.
    details: >-
      Web results reach the model numbered [w1], [w2] and it is asked to cite them right after the
      claim they support. Chips are numbered in reading order like article chips, so a chip and its
      card match. Desktop article chat: cards fill the panel width (as many across as fit), chips
      and cards light each other up on hover, and results the answer did not cite fold under
      "Also found on the web (n)". iOS: the same chips in every web-enabled answer, and the cards
      scroll in a row under it, replacing the plain link pills.
    source:
      text: would be nice to have links to refrences also in text and better looking sources
      reference: Giulio, project thread "Chat answer citation design", 2026-10-25
  - id: chat-starter-prompts
    description: >-
      An empty library chat offers a few built-in starter questions, and tapping one asks it right
      away.
    details: >-
      Desktop Ask Skim and iOS Chat with Articles show the same three: the top 10 things to know
      from today's articles, what the reader missed this week, and where sources disagree on the
      biggest stories. Each is a broad catch-up, so it reads the newest articles in the chosen
      scope (up to 15) instead of searching for its words; questions made only of briefing words
      ("today", "top 10", "should know") do the same. A context example that ends in an ellipsis
      is filled into the composer for the reader to finish.
    source:
      text: We should have some prompts like this builtin
      reference: Giulio, project thread with a screenshot of "What are top 10 things i should know from today's articles", 2026-10-15
  - id: app-agent
    description: >-
      Skim's assistant answers with tools over the app: it searches the library, reads articles,
      opens one when asked, and can search the web, using the reader's configured AI provider.
    details: >-
      Desktop. One backend serves the command palette and the full Ask Skim chat. Tools work with
      every provider (hosted, subscription, CLI and on-device) through a plain-text tool protocol,
      bounded to a few tool calls per answer. Citation numbers stay stable across a conversation.
      It opens an article only when the reader asks it to.
  - id: context-aware-chat
    description: >-
      The assistant knows what the reader is looking at: on Today, the stories on the page and the
      story of the open article; in the reader, the open article; elsewhere, the current list.
    details: >-
      "This article" and "this story" refer to them. The full chat names the context in its header
      and offers questions that fit it. Other surfaces (such as Today's own Ask) can open the full
      chat on a given page or story context.
  - id: chat-settings-cog
    description: >-
      Article chat and Ask Skim keep the model choice behind a cog in their header, not a dropdown,
      matching the cog on Today.
    details: The cog's popover holds the chat model and a link to AI settings. Escape or an outside click closes it.
    source:
      text: can we have cog icon instead of model selector?
      reference: Giulio, project chat about the article chat header, 2026-10-12
  - id: chat-collapse-not-clear
    description: >-
      The article chat collapses from a click anywhere on its header row, and clearing the
      conversation sits inside the cog with an Undo, so a quick click near collapse never wipes it.
    details: >-
      Desktop and the narrow web layout: the header row (Chat, ephemeral, chevron) is one collapse
      button with a 32px chevron target (44px on phones). The cog sits over the row; "Clear
      conversation" is the last item in its popover, in red. After clearing, a "Conversation
      cleared. Undo" line sits under the header until the reader sends again or changes article.
      The iOS chat sheet has no Clear button, so it is unaffected.
    source:
      text: collaps button should be easier to click and it should be hard to misclick "Clear" instead
      reference: Giulio, project thread "Make chat collapse easy, Clear hard to misclick", 2026-10-27
  - id: article-chat
    description: >-
      A reader can chat with any article; answers are grounded in the article's full text and the
      conversation so far, not just the feed teaser.
  - id: ask-about-highlight
    description: >-
      A reader can highlight a passage in the article and ask about it in chat: the chat opens with
      the passage quoted above the composer, ready for a question.
    details: >-
      iOS adds "Ask in Chat" as the first item of the text selection menu in the reader (article
      body, post text and comments); the article menu moved to a long press on the header so a long
      press on the body selects text. Desktop shows a small floating pill (chat icon and "Ask",
      28 px tall, named "Ask in chat" for screen readers) just above the selection in the reader, sized
      to fit between lines so it does not cover the text above (Giulio, 2026-10-20: "love this, but
      a little big"). The quote is sent as "About this passage from the article" and the
      bubble labels it "From the article", distinct from replying to one of Skim's answers. A quoted passage
      belongs to the article it came from: moving to another article drops it from the chat (Giulio,
      2026-10-20: "ask in chat should not transfer across articles").
    source:
      text: I'd like the ability to easily highlight text and ask about it in chat
      reference: Giulio, project thread "highlight text and ask in chat", 2026-10-14
  - id: ask-about-briefing-highlight
    description: >-
      A reader can highlight a passage in an AI-written Briefing or Today story and ask about it in
      chat: the chat about that story opens with the passage quoted above the composer.
    details: >-
      The story's headline, dek, body, takeaways, pull quotes and briefs stay selectable even though
      app chrome is not. Desktop shows the same floating "Ask" pill as the reader, above the
      selection inside the story; iOS Briefing paragraphs and takeaways offer "Ask in Chat" first in
      the selection menu, and their citation numbers still open the report. The quote is sent as
      "About this passage from the story" and labelled "From the story".
    source:
      text: i wanna be able to select and ask
      reference: Giulio, project thread "Select and ask in briefings", 2026-10-26
  - id: quote-focuses-composer
    description: >-
      Asking about a highlighted passage, or replying to a selection in one of Skim's answers, puts
      the cursor in the chat's text box so the reader can type the question straight away.
    details: >-
      Applies to the reader, Briefing and Today stories, and chat answers, on desktop and iOS. On
      iOS the keyboard comes up with the quote; the selected text lets go of its selection first so
      the keyboard is not held by it. Desktop focuses the box at every window width, including the
      phone-width layout, where opening Ask Skim without a quote still leaves the keyboard down.
    source:
      text: when I select text and hit Ask or Reply to selection, focus should move to the chat textbox so I can type right away
      reference: Giulio, project thread "Focus chat box after Ask on selection", 2026-10-27
  - id: web-search
    description: >-
      Chat can search the web when the library does not cover a question, and web sources are marked
      as such in the citations.
    details: >-
      Supported by Claude providers on desktop; desktop MLX and iOS expose a "Web search in chat"
      setting.
      A web source chip whose title is longer than the chat bubble truncates with an ellipsis and
      stays inside the bubble, so it never widens the chat (Giulio, 2026-10-14: "Chat body width
      sligthly messed up by long source - maybe ellipses?").
      A search returns every organic result DuckDuckGo lists (up to the requested count), skipping
      sponsored and duplicate links, and a DuckDuckGo bot check is reported as a failed search
      rather than as no results (Giulio, 2026-10-19: "consistently only finds one result, bug
      with tool?").
  - id: deep-research
    description: >-
      The reader can ask for deep research on a topic: Skim searches and reads their feeds first,
      then searches and reads the web for what the feeds leave out, and writes a full briefing that
      cites both.
    details: >-
      Opt-in and slower than a chat answer (a minute or two), with every step shown as it happens.
      The steps are fixed so every provider follows them: plan library searches, search the feeds
      (up to 14 articles, the best 8 read in full), find the gaps, run up to 3 web searches, read up
      to 4 web pages, then write. The briefing opens with a 2 to 3 sentence bottom line, then
      sections such as What's happening, Background, Where sources differ and What to watch. Articles
      are cited [n] and web sources [wN]; both become the same numbered chips and cards, numbered in
      reading order, and web results the briefing never cites stay under "Also searched". Desktop:
      the Cmd+K palette offers "Research in depth" under the Ask row and on Option-Enter, which opens
      the full Ask Skim chat in research mode; Ask Skim has a Deep research toggle by the composer.
      iOS: Chat with Articles has the same toggle. A failed web search still produces a briefing
      from the feeds and says the search failed. Follow-up questions continue as ordinary chat.
    source:
      text: >-
        I would also like to request a full briefing on a topic (a bit like cmd+k + type question,
        but having the option of requesting a slower and more complete research and briefing that
        extends past just the feeds, into websearch to fill any gaps
      reference: Giulio, project thread "Add deep research topic briefings", 2026-10-24
  - id: answer-first-on-small-models
    description: >-
      On-device models answer first, stay grounded in exact source passages, and drop chatbot
      boilerplate.
  - id: chat-recovers-after-settings-fix
    description: >-
      After the reader fixes their AI settings, an article chat that failed works again without
      reopening the app.
  - id: chat-easy-reading
    description: >-
      In the iOS chat sheet the reader can put the keyboard away to read, and a new answer opens
      at its first line rather than its end.
    details: >-
      Swiping down on the conversation, tapping it, or the hide button beside the input dismisses
      the keyboard. When an answer arrives the conversation scrolls so the answer's top sits at
      the top of the view; a sent question still scrolls to the bottom. Scrolled-up messages stop
      at a solid edge below the Close and model buttons instead of running beneath them.
    source:
      text: >-
        I wanna be able to easily dismiss keyboard for easier reading. Also right after generation
        of chat response, it auto scrolls all the way to the botton and you can't see much till i
        scroll back up
      reference: Giulio, project chat, 2026-10-14
