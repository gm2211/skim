id: chat
name: Ask Skim and article chat
behaviors:
  - id: ask-skim-grounded
    description: >-
      Ask Skim answers a question from the reader's library with numbered citations to the articles
      it used, and lists separately the articles it only searched.
    details: >-
      Desktop scopes are Inbox (priority 3 and up), Unread (default), and All. Enter sends and
      Shift+Enter adds a line.
  - id: chat-starter-prompts
    description: >-
      An empty library chat offers a few built-in starter questions, and tapping one asks it right
      away.
    details: >-
      Desktop Ask Skim and iOS Chat with Articles show the same three: the top 10 things to know
      from today's articles, what the reader missed this week, and where sources disagree on the
      biggest stories. Each is a broad catch-up, so it reads the newest articles in the chosen
      scope (up to 15) instead of searching for its words; questions made only of briefing words
      ("today", "top 10", "should know") do the same. A context example that ends in an ellipsis
      is filled into the composer for the reader to finish.
    source:
      text: We should have some prompts like this builtin
      reference: Giulio, project thread with a screenshot of "What are top 10 things i should know from today's articles", 2026-10-15
  - id: app-agent
    description: >-
      Skim's assistant answers with tools over the app: it searches the library, reads articles,
      opens one when asked, and can search the web, using the reader's configured AI provider.
    details: >-
      Desktop. One backend serves the command palette and the full Ask Skim chat. Tools work with
      every provider (hosted, subscription, CLI and on-device) through a plain-text tool protocol,
      bounded to a few tool calls per answer. Citation numbers stay stable across a conversation.
      It opens an article only when the reader asks it to.
  - id: context-aware-chat
    description: >-
      The assistant knows what the reader is looking at: on Today, the stories on the page and the
      story of the open article; in the reader, the open article; elsewhere, the current list.
    details: >-
      "This article" and "this story" refer to them. The full chat names the context in its header
      and offers questions that fit it. Other surfaces (such as Today's own Ask) can open the full
      chat on a given page or story context.
  - id: chat-settings-cog
    description: >-
      Article chat and Ask Skim keep the model choice behind a cog in their header, not a dropdown,
      matching the cog on Today.
    details: The cog's popover holds the chat model and a link to AI settings. Escape or an outside click closes it.
    source:
      text: can we have cog icon instead of model selector?
      reference: Giulio, project chat about the article chat header, 2026-10-12
  - id: article-chat
    description: >-
      A reader can chat with any article; answers are grounded in the article's full text and the
      conversation so far, not just the feed teaser.
  - id: web-search
    description: >-
      Chat can search the web when the library does not cover a question, and web sources are marked
      as such in the citations.
    details: >-
      Supported by Claude providers on desktop; desktop MLX and iOS expose a "Web search in chat"
      setting.
  - id: answer-first-on-small-models
    description: >-
      On-device models answer first, stay grounded in exact source passages, and drop chatbot
      boilerplate.
  - id: chat-recovers-after-settings-fix
    description: >-
      After the reader fixes their AI settings, an article chat that failed works again without
      reopening the app.
