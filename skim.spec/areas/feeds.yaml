id: feeds
name: Feeds and import
prose: >-
  Getting feeds into Skim and keeping them fresh. Desktop can sync with Feedly over OAuth; iOS
  imports Feedly subscriptions through an OPML file.
behaviors:
  - id: add-feed-by-url
    description: >-
      A reader can add a feed by URL. Skim resolves the feed document and its site, and accepts RSS
      2.0, Atom, and JSON Feed.
  - id: feed-discovery
    description: >-
      Adding feeds happens in Discover, a full browsing view (not a modal) on desktop and iOS,
      opened from the sidebar's "Discover feeds" row or the + button. Its home has a search box
      ("Type a name, topic, or paste a URL"), featured topics and a topic list. A topic page lists
      its top feeds; a feed page shows the feed's recent posts grouped by day. Every feed row and
      feed page has a Follow button that adds the feed in place; feeds already in the library show
      "Following".
    details: >-
      Pasting a website (or `theverge.com`, `r/rust`) lists every feed Skim finds on it; typing
      words searches feeds by topic or name. Discovery reads the page's `<link rel="alternate">`
      feeds plus known patterns (Reddit subreddits and users, YouTube channels and playlists,
      GitHub repos and users, Hacker News, Medium, Mastodon, Bluesky) and falls back to common paths
      (/feed, /rss, /atom.xml, ...) when nothing else turns up. Topics and search merge the built-in
      catalog (shared/feed-catalog.json) with Feedly's public, keyless feed search; the catalog
      alone answers when Feedly is unreachable. The catalog is generated, not hand-edited:
      tools/feed-catalog/build.mjs probes every candidate in tools/feed-catalog/sources.json
      (Skim's hand picks plus the CC0 plenaryapp/awesome-rss-feeds collection) with Skim's
      User-Agent and keeps feeds that parse, are not podcasts, and posted within 365 days (hand
      picks) or 120 days (imports); topics with fewer than 6 live feeds are left out. The October
      2026 run kept 389 feeds in 24 topics out of 692 candidates. Giulio asked for this after
      seeing the Programming topic: "where are these sourced, looks hardcoded and there are too
      little - research how to properly source for discover" (Discover sources thread,
      2026-10-20). Adding a website address by URL also resolves it to
      its first feed. OPML and Feedly import moved to an Import button in Discover's header. The
      original ask was "I'd like to have rss feed discovery and ability to easily add feeds like I
      can do on feedly" (Giulio, project chat, 2026-10-14).
    source:
      text: >-
        Add feeds should not be a modal - it should be a dedicated browsing view where I can see
        categories of feeds, open feeds and also start "following" feeds
      reference: Giulio, feed discovery thread, 2026-10-14
  - id: opml-import-with-preview
    description: >-
      A reader can import an OPML file and preview the feeds before importing them. iOS offers
      Import OPML from the empty library state.
  - id: opml-drop-anywhere
    description: >-
      Desktop: dropping an .opml or .xml file anywhere in the window imports it in the background and
      confirms with "Imported N feeds".
  - id: feedly-oauth-sync
    description: >-
      Desktop: a reader can sign in with Feedly from Settings > Sync to pull subscriptions, entries,
      read state, and stars. Read, unread, mark-feed-read, and star changes made in Skim are pushed
      back to Feedly. The reader can disconnect.
  - id: feedly-opml-on-ios
    description: >-
      iOS: "Import from Feedly" guides the reader to download their Feedly OPML on the web and pick
      that file; iOS has no Feedly account connection.
  - id: refresh-on-launch-and-focus
    description: >-
      Desktop: all feeds refresh and triage on launch, and again when the window regains focus if
      the last refresh was more than an hour ago. The sidebar has a manual refresh button.
  - id: auto-refresh-interval
    description: >-
      The "Auto-refresh interval" setting controls how often feeds refresh while Skim is open.
    details: >-
      Known gap (2026-10-10): desktop shows and saves this setting, but nothing reads
      refresh_interval_minutes yet.
  - id: per-feed-article-cap
    description: >-
      Each feed keeps at most "max articles per feed" articles (default 200) so a runaway feed cannot
      bloat the library.
  - id: duplicate-feed-merge
    description: >-
      Desktop: when feeds normalize to the same URL, a banner reports "N duplicate feeds found" and
      offers to merge them.
  - id: feed-menu
    description: >-
      Desktop: a feed's menu offers Rename, Move to folder, and Remove feed.
