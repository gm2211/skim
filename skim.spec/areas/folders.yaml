id: folders
name: Folders and smart folders
behaviors:
  - id: flat-manual-folders
    description: >-
      Readers organize feeds into flat folders (no nesting), created, renamed, and deleted from the
      sidebar. Desktop moves feeds between folders through the feed menu.
  - id: smart-folder-rules
    description: >-
      A smart folder collects feeds by rule: feed title regex, feed URL regex, or OPML category,
      matching any or all rules. Smart folders and regular folders convert into each other.
    details: Desktop and iOS evaluate rules against the same shared fixtures (smart-folder-matches).
  - id: topic-to-feeds
    description: >-
      Desktop: when creating a folder, a reader can describe a topic and AI picks the matching feeds.
  - id: auto-organize
    description: >-
      "Auto-organize with AI" proposes folders for feeds, either for unassigned feeds only (default)
      or by reorganizing everything. The reader can choose a name casing style, skip individual
      proposed folders, and then apply or cancel. iOS shows a local fallback preview when AI is
      unavailable.
  - id: auto-organize-feedback
    description: >-
      In the auto-group sheet (iOS) and the Auto-organize dialog (desktop), the reader can type free
      text feedback on the proposed folders, such as "merge Coding into SoftwareEngineering" or "put
      Joel on Software in Blogs", and the AI revises the current proposal accordingly instead of
      starting over. A feed the revision leaves out stays in its previous folder.
    source:
      text: Should be able to give free text feedback to the grouping
      reference: Giulio, project thread "Free text feedback on feed grouping", 2026-10-15
  - id: auto-organize-icon
    description: >-
      The sidebar has one folders button, next to FEEDS, showing a folder with several AI sparkles
      (not a plus). It opens a menu: New folder, New smart folder, and Auto-organize with AI ("Organize
      with AI" on iOS, so it fits on one line), on both desktop and iOS. iOS also lists Auto-group
      Feeds in Settings.
    details: >-
      Giulio, 2026-10-15: "there should be more than one sparkle to make it clear it's not a plus",
      then "not two icons... we move menu to the sparkly icon and get rid of the plus icon".
    source:
      text: >-
        not two icons, thanks - plus icon with menu makes sense - the problem is that on ios it goes
        straight to AI - wonder though if to keep things simple, we move menu to the sparkly icon and
        get rid of the plus icon
      reference: Giulio, project chat, 2026-10-15
  - id: ios-manual-folders
    description: >-
      iOS: a reader can create an empty folder or a smart folder from the folders menu, and move a feed
      into or out of a regular folder from the feed's long-press menu. Empty regular folders still show
      in the sidebar.
