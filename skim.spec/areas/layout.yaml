id: layout
name: Layout and touch
behaviors:
  - id: responsive-panes
    description: >-
      Desktop: below 1100 px the sidebar auto-collapses, below 830 px the list collapses, and below
      600 px the app switches to one pane at a time. Panes the app collapsed re-expand when space
      returns.
  - id: narrow-gestures
    description: >-
      Desktop narrow layout: swiping from the left edge reveals the sidebar, pull-to-refresh refreshes
      the list, and swipe-to-dismiss owns the gesture over the reader, including web view.
  - id: chat-reachable-when-narrow
    description: Article chat stays reachable in narrow Mac windows.
  - id: one-icon-per-action
    description: >-
      Desktop title bar: each action has one icon and appears once. The sidebar header carries the
      app-wide actions (collapse, refresh, Ask Skim, Quick Catch-up as the newspaper, add feed);
      the list toolbar carries only the list's own (mark all read, search) and repeats the app-wide
      ones only while the sidebar is hidden. The bolt belongs to Today alone, on its sidebar row.
    source:
      text: newspaper view / icon is on second tab but still lightning on first
      reference: Giulio, project chat, 2026-10-11
