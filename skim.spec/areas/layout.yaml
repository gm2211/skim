id: layout
name: Layout and touch
behaviors:
  - id: responsive-panes
    description: >-
      Desktop: below 1100 px the sidebar auto-collapses, below 830 px the list collapses, and below
      600 px the app switches to one pane at a time. Panes the app collapsed re-expand when space
      returns.
  - id: narrow-gestures
    description: >-
      Desktop narrow layout: swiping from the left edge reveals the sidebar, pull-to-refresh refreshes
      the list, and swipe-to-dismiss owns the gesture over the reader, including web view.
  - id: chat-reachable-when-narrow
    description: Article chat stays reachable in narrow Mac windows.
  - id: one-icon-per-action
    description: >-
      Desktop title bar: each action has one icon and appears once. Today is the newspaper. The
      sidebar header carries
      the app-wide actions (collapse, refresh, Ask Skim, Today, add feed); the list toolbar carries
      only the list's own (mark all read, search) and repeats the app-wide ones only while the
      sidebar is hidden.
    source:
      text: >-
        newspaper view / icon is on second tab but still lightning on first [...] today should
        have newspaper icon
      reference: Giulio, project chat, 2026-10-11
  - id: ios-one-icon-per-action
    description: >-
      iOS uses one icon per action and destination everywhere it appears. The bottom-bar views
      use the icons Giulio picked: Unread the full tray, All the justified text lines, Today the
      house, and Search the magnifying glass in a circle. Elsewhere iOS uses the desktop's icon:
      AI Inbox the tray, chat and Ask Skim the speech bubble, Summarize the sparkles, and leaving
      the app (open in browser, original page) the arrow-out-of-box.
    details: >-
      The mapping lives in one place in the iOS code (SkimIcon in Style.swift). Starring reads
      Star/Unstar in every menu, matching the reader toolbar. The bar icons were chosen from five
      SF Symbol alternatives per tab (project file tab-icons/tab-icons.png): Unread
      tray.full, All text.justify.left, Today house, Search magnifyingglass.circle. They apply
      wherever iOS shows those destinations, so iOS differs from the desktop's newspaper for Today.
    source:
      text: icons inconsistent in ios view
      reference: Giulio, project chat, 2026-10-12
  - id: ios-bar-icon-picks
    description: >-
      Giulio's choice of iOS bottom-bar icons from the five-option comparison sheet: Unread option
      3, All option 4, Today option 5, Search option 2.
    source:
      text: 3,4,5,2
      reference: Giulio, project chat, 2026-10-13, answering the tab-icons sheet (Unread, All, Today, Search)
  - id: ios-bottom-bar
    description: >-
      iOS bottom bar shows each view as an icon over its name. It defaults to Unread, All, Today and
      Search, and Giulio chooses which views appear and their order (two to five of Today, Unread,
      All, Starred, Recent, AI Inbox and Search) from Customize Bottom Bar, reached by
      long-pressing the bar or from the "…" menu.
    details: >-
      Today opens in place of the article list, with the bar still showing, rather than as a pushed
      page; picking a feed, folder or library view returns to the list. AI Inbox opens its page.
      There is no catch-up bar option (a saved bar that still names one just loses that item);
      on iPhone the Today title sits between the title bar's buttons and "Ask about Today" is
      the first item of its "…" menu, so nothing covers the title.
    source:
      text: bottom row in ios can use improvement (maybe let me choose the today view instead of the favorite view)
      reference: Giulio, project chat, 2026-10-12
