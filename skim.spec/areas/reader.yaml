id: reader
name: Reader
behaviors:
  - id: full-text-extraction
    description: >-
      Opening an article extracts its full text automatically. If extraction fails, the reader shows
      the RSS preview with a notice and a way to retry, and the web view still works. Reddit, Hacker
      News and Lobsters items use the aggregator layout instead (reader.aggregator-post-layout).
  - id: reader-web-toggle
    description: >-
      A reader can switch between the extracted Reader view and the original Web view (desktop
      toolbar or arrow keys; iOS swipe).
  - id: toolbar-overflow-menu
    description: >-
      Desktop: the reader toolbar stays one row. When the pane is too narrow to fit every action,
      the Reader/Web switch, star, share, pin, mark read and open in browser fold into a "…" menu, and
      only close, history, chat and Summarize stay on the row.
    source:
      text: >-
        resizing is tough but icons look ugly this way - I think "ellipses.." where you put other
        actions in a ... menu is the better way to preserve layout on narrower screens
      reference: Giulio, project chat, 2026-10-11
  - id: open-marks-read
    description: Opening an article marks it read.
    details: >-
      If saving the read state fails, the desktop reader says so under its toolbar instead of
      leaving the unread dot with no explanation. A crash inside one database command does not
      stop later commands from saving: the app keeps using its database rather than failing every
      write until it is relaunched.
    source:
      text: articles not getting marked as read
      reference: Giulio, project thread "Articles not marked read", 2026-10-20, desktop article list
  - id: reading-time-tracked
    description: >-
      Time spent reading an article is recorded as an engagement signal (desktop skips this when the
      article is opened from Recent).
  - id: aggregator-comments
    description: >-
      Hacker News, Reddit and Lobsters items end with a Discussion section that shows the thread
      itself: top comments with author and points, their replies nested beneath them (direct
      replies shown, deeper levels folded behind an "N replies" toggle), a "Show more comments"
      action that reveals further top-level threads, and an action to open the thread on the site.
      When Reddit refuses its JSON API, comments come from the thread's RSS feed instead (no points
      or nesting). Only when no comments can be loaded does a card open the conversation on the
      site instead of an error.
    source:
      text: I love this, but could we also extract comments and show them here?
      reference: Giulio, project thread "Inline Reddit comments", 2026-10-14
  - id: aggregator-post-layout
    description: >-
      Reddit, Hacker News and Lobsters items get a purpose-built reader layout instead of the
      generic one: the community and submitter in the header, a self post's own text, and for a
      link post a card naming the linked site with a primary "Read on <site>" action. The reader
      copy comes from the linked story, not the aggregator page; once it is ready the card shrinks
      to a one-line source row above it. Raw feed HTML ("submitted by ... [link] [comments]") is
      never shown, and a story Skim can't extract keeps the card with a calm note rather than an
      error banner.
    source:
      text: >-
        don't like flimsy links and messy layouts - especially for things that we are
        special-casing like reddit or hackernews, we should be able to optimize ui
      reference: Giulio, project thread "Reddit and Hacker News layout", 2026-10-10
  - id: reader-toolbar
    description: >-
      Desktop: the reader toolbar offers back/forward, Chat, Reader/Web, Summarize, Star, Share,
      Read, Pin to top, and Open in browser.
  - id: share-article
    description: >-
      The reader has a Share icon (iOS: in the top bar after Star, and in the article's context
      menu; desktop: in the toolbar after Star, or the "…" menu when narrow). It opens the system
      share sheet with the article's title and link; a Reddit, Hacker News or Lobsters link post
      shares the linked story rather than the aggregator page. Where no share sheet exists the
      link is copied and the icon briefly shows a tick. All seven iOS top-bar icons fit on a
      375pt-wide iPhone.
    source:
      text: I'd like a share button (icon)
      reference: Giulio, project thread "Share button", 2026-10-14
  - id: offline-preload
    description: >-
      The newest articles are prepared for offline reading, up to a limit the reader sets (desktop
      Settings > Reading, 25-1000; iOS Settings > Library).
