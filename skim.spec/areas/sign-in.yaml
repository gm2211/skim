id: sign-in
name: Sign-in
behaviors:
  - id: claude-subscription-sign-in
    description: >-
      A reader can sign in with their Claude Pro/Max subscription instead of an API key. Desktop
      offers a browser sign-in that returns to the app and a copy-paste code flow; iOS signs in
      in-app. Tokens refresh automatically and the reader can sign out.
  - id: claude-sign-in-redirect-works
    description: >-
      Desktop browser sign-in with Claude completes without a redirect URI error.
    details: >-
      The Claude Code OAuth client only accepts http://localhost:<port>/callback, so the loopback
      redirect uses localhost (port 54134) and Skim listens on both IPv4 and IPv6 loopback.
  - id: supergrok-sign-in
    description: >-
      A reader can sign in to the Grok (xAI) provider with their SuperGrok subscription instead of
      an API key, on desktop and iOS, and sign out. An entered API key takes priority. Tokens
      refresh automatically.
    details: >-
      Device-code flow (RFC 8628) against auth.x.ai, the same flow BYOS's grok() provider offers.
      The UI is BYOS's DeviceCodeSignIn; Skim's Rust side plays the BYOS site-handshake role
      because auth.x.ai sends no CORS headers and Skim has no Node server for BYOS's broker. xAI has no official third-party
      client, so Skim uses the public Grok CLI client id; xAI may return 403 for some SuperGrok
      tiers, in which case the API key path remains. Giulio chose to add this unofficial sign-in on
      2026-10-10.
    source:
      text: 'Chose "Add it" on the decision card asking "Add an unofficial ''Sign in with SuperGrok'' option to Skim''s xAI provider?"'
  - id: chatgpt-subscription-sign-in
    description: >-
      A reader can sign in with their ChatGPT Plus/Pro plan instead of an API key, on desktop and
      iOS, pick from the models their plan lists, and sign out. Tokens refresh automatically. Skim
      runs on the plan's Codex allowance, and a used-up allowance reads as a plan limit, not an error.
    details: >-
      OpenAI's official Sign in with ChatGPT with ChatGPT plan usage, offered to open-source apps
      (developers.openai.com/siwc/token-sharing-open-source). Authorization Code + PKCE against
      auth.openai.com with scopes "openid profile email offline_access resource.invoke
      chatgpt.tokens.use.direct" and resource https://api.openai.com/v1. The first sign-in
      registers Skim with client_id=dynamic_agent_client, agent_name_hint=Skim and a per-install
      ext_agent_host_id; every later sign-in sends the same ext_agent_host_id and the issued client
      id, which is kept through sign-out and used for every refresh. A callback naming a different
      client id is refused. When the code exchange returns invalid_grant or invalid_client, Skim
      says "ChatGPT didn't accept that sign-in. Sign in again." and forgets the issued client id, so
      the next sign-in registers afresh (Giulio hit "ChatGPT sign-in failed (400): invalid_grant"
      on desktop, 2026-10-15). The redirect is a loopback on 127.0.0.1:1455 (54321 if busy); OpenAI
      refuses localhost. On iOS the page opens in the in-app browser sheet while Skim listens on the
      loopback port, and the sheet closes when ChatGPT redirects back. Sign-in is refused unless the
      reader grants chatgpt.tokens.use.direct. Inference uses the public Responses API with
      store false and stream true and no sampling parameters, read until response.completed; models
      come from GET /v1/models, keeping visibility "list", and the first one is the default.
    source:
      text: 'Byos should support codex subscription, especially now that they made "sign with codex" or something like that, an official thing'
      reference: Giulio, project chat, 2026-10-13
  - id: ios-sign-in-stays-in-app
    description: >-
      On iOS, the Claude, ChatGPT, and SuperGrok sign-in pages open in an in-app browser sheet, so
      the reader never leaves Skim to sign in.
    details: >-
      SFSafariViewController, since neither flow has a callback Skim can catch: Claude shows a code
      to copy, and SuperGrok is a device-code approval that Skim polls for and closes the sheet on.
      The sheet does not share Safari's cookies, so the reader may need to sign in to claude.ai or
      x.ai there.
    source:
      text: "I think the supergrok may be caused by switching app to safari - could we maybe have in-app browser for signin?"
      reference: Giulio, project chat, 2026-10-13
  - id: supergrok-sign-in-survives-leaving-the-app
    description: >-
      On iOS, approving the SuperGrok sign-in in Safari and coming back completes the sign-in; a
      connection dropped while Skim was in the background does not fail it.
    details: >-
      iOS suspends Skim while the reader is in Safari, so the token poll in flight returned "The
      network connection was lost." and the sign-in stopped. Network blips now poll again until the
      code expires.
    source:
      text: "I complete the flow but get [The network connection was lost.]"
      reference: Giulio, project chat, 2026-10-13
  - id: feedly-sign-in
    description: >-
      Desktop: Feedly sign-in uses OAuth with a local callback and refreshes its token before it
      expires.
